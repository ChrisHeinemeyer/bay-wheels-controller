[features]
# Light sleep is what makes battery life work; opt out with --no-default-features.
default = ["light-sleep"]
# Route dprintln! to the USB serial port instead of RTT.
# When set, serial_status_task is not spawned (USB serial is used for text output).
debug-serial = []
# Load SSID and PASSWORD from .env at build time (for development).
# Copy .env.dist to .env and set your WiFi credentials.
use-env = []
# Light-sleep the CPU between tasks while the radio is off (src/power.rs). On by
# default. USB-Serial-JTAG stops while the CPU sleeps, so probe-rs/espflash can
# only attach in a no-sleep window: the first 20s after reset, or 30s after a
# GPIO2 (provisioning button) press. Last resort: strap GPIO0 to GND at reset
# for ROM download mode.
light-sleep = []
# Diagnostic: count embassy task polls per task while light-sleeping, printed
# with the light-sleep stats on wake, to find what keeps waking the CPU.
sleep-trace = ["light-sleep", "embassy-executor/trace"]
# POST a JSON status report (battery, RSSI, fetch age, reset cause, ...) to
# LOG_SERVER from .env once per fetch cycle, while the radio is already up.
log-server = []
# Fetch station data from the LAN GBFS mirror in the Home Assistant add-on
# (GBFS_MIRROR in .env), falling back to Lyft over HTTPS if it fails. Skips
# DNS, TLS and ~270 KB of download per cycle.
gbfs-mirror = []

[package]
edition      = "2024"
name         = "bay-wheels-controller"
rust-version = "1.88"
version      = "1.0.0"

[[bin]]
name = "bay-wheels-controller"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.0", features = ["esp32s3", "unstable"] }

esp-rtos = { version = "0.2.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }

embassy-net = { version = "0.7.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
  "dns",
] }
embedded-io = "0.6.1"
embedded-io-async = "0.6.1"
embedded-nal-async = "0.8.0"
embassy-futures = "0.1.2"
esp-alloc = "0.9.0"
rtt-target = "0.6.2"
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.9.1", features = [] }
embassy-time = "0.5.0"
esp-radio = { version = "0.17.0", features = [
  "esp-alloc",
  "esp32s3",
  "smoltcp",
  "unstable",
  "wifi",
] }
esp-wifi-sys = { version = "0.8", features = ["esp32s3"] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "medium-ethernet",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
heapless = "0.8.0"
picojson = { version = "0.2", default-features = false, features = ["int32"] }
reqwless = { version = "0.13.0", default-features = false, features = ["embedded-tls", "alloc"] }
edge-nal = "0.3.0"
int-enum = "1.2.0"
embassy-sync = "0.7.2"
strum = { version = "0.27.2", default-features = false }
strum_macros = "0.27.2"
esp-storage = { version = "0.8", features = ["esp32s3"] }
esp-nvs = { version = "0.1", features = ["esp32s3"] }
nb = "1.1.0"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
# Using opt-level 1 for better debugging (less aggressive than "s")
opt-level = 1
debug = true  # Enable debug symbols for better stack traces

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false


[lints.clippy]
# Treat usage of unwrap() as a warning
unwrap_used = "warn" 
# Treat usage of expect() as a warning
expect_used = "warn" 

[patch.crates-io]
# esp-rtos 0.2.0 with the esp-radio timer leak fix backported from 0.3.0
# (0.3.0 needs esp-hal 1.1). See the PATCHED comment in
# patches/esp-rtos-0.2.0/src/esp_radio/timer_queue.rs. Drop this once on
# esp-rtos >= 0.3.0.
esp-rtos = { path = "patches/esp-rtos-0.2.0" }
# smoltcp 0.12.0 with DHCP DISCOVER retransmissions keeping their transaction
# ID, so a short discover_timeout doesn't drop slow OFFERs. See the PATCHED
# comment in patches/smoltcp-0.12.0/src/socket/dhcpv4.rs.
smoltcp = { path = "patches/smoltcp-0.12.0" }
